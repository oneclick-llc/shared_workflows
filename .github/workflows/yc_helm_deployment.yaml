name: Deployment Helm
on:
  workflow_call:
    inputs:
      bundled_without:
        required: false
        type: string
      namespace:
        required: true
        type: string
      service_name:
        required: true
        type: string
      values_path:
        required: true
        type: string
      service_version:
        required: true
        type: string
      chart_type:
        default: "service"
        required: false
        type: string
      chart_version:
        default: "1.1.1"
        required: false
        type: string
      timeout:
        default: "5m0s"
        required: false
        type: string
      newrelic_guid:
        required: false
        type: string
    secrets:
      oci_registry:
        required: true
      oci_dockerconfigjson: # b64 enc
        required: false
      kubeconfig: # b64 enc
        required: true
      sa_json:
        required: true
      bundle_token:
        required: false
      newrelic_api_key:
        required: false
jobs:
  deployment:
    name: Deploy
    runs-on: ubuntu-22.04
    env:
      ENV: dev
      KUBECONFIG_B64: ${{ secrets.kubeconfig }}
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.bundle_token }}
      BUNDLE_WITHOUT: ${{ inputs.bundle_without }}
      OCI_REGISTRY: ${{ secrets.oci_registry }}
      DOCKERCONFIGJSON_B64: ${{ secrets.oci_dockerconfigjson }}
      NEW_RELIC_API_KEY: ${{ secrets.newrelic_api_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Init kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Login to Yandex Cloud Container Registry
        id: login-cr
        uses: yc-actions/yc-cr-login@b3f9f3de6a883203431aeec20f3cc602fafd3a05 # v2.0.0
        with:
          yc-sa-json-credentials: ${{ secrets.sa_json }}

      #  --atomic
      - name: Helm deployment
        run:  helm upgrade --install --atomic --timeout ${{ inputs.timeout }} ${{ inputs.service_name }} --namespace=${{ inputs.namespace }} "$OCI_REGISTRY/${{ inputs.chart_type }}" --version  ${{ inputs.chart_version }} --values ${{ inputs.values_path }} --set image.tag=${{ inputs.service_version }}

      - name: Drop credentials
        if: always()
        run: |
          rm -rf ~/.kube
          rm -rf ~/.docker
          
      
